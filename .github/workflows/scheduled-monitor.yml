name: Scheduled E2E Monitor & Auto-Issue Loop

on:
  schedule:
    # Chạy tự động mỗi 30 phút một lần
    - cron: '*/30 * * * *'
  workflow_dispatch: # Cho phép bạn bấm nút chạy test thủ công trên GitHub UI bất cứ lúc nào

permissions:
  contents: read
  issues: write

jobs:
  monitor-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run E2E Monitor Suite
        id: pw_run
        run: npx playwright test --project=chromium
        env:
         LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME }}
         LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}

      # Khép kín vòng lặp: Tự động tạo Issue khi monitor fail
      - name: Open Incident Issue on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Chống spam mỗi 30 phút: tìm issue sự cố đang mở BẤT KỂ label (agent-ready, agent-in-progress,
          # agent-review, agent-blocked). GitHub search bỏ qua dấu [ ], nên lọc thêm bằng startswith để không
          # nhầm với issue có chữ "[Monitor Alert]" ở giữa tiêu đề.
          EXISTING=$(gh issue list --state open --search '"[Monitor Alert]" in:title' --limit 100 \
            --json number,title \
            --jq '[.[] | select(.title | startswith("[Monitor Alert]"))] | sort_by(.number) | .[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" \
              --body "🔁 Monitor vẫn fail ở run #${{ github.run_number }}: $RUN_URL"
            echo "Incident #$EXISTING is still open - added the new run link instead of opening a duplicate."
          else
            gh issue create \
              --title "[Monitor Alert] Production E2E check failed (Run #${{ github.run_number }})" \
              --label "agent-ready" \
              --body "$(cat <<EOF
          ## Incident Details
          - **Workflow Run:** ${RUN_URL}
          - **Trigger:** Scheduled E2E Monitor failed on \`main\`.

          ## Acceptance Criteria for Agent
          1. Inspect the failing test logs/trace from run #${{ github.run_number }} using \`gh run view ${{ github.run_id }} --log-failed\`.
          2. Determine whether it is a broken locator, timing issue, or application regression.
          3. Implement a fix following \`CODING_STANDARDS.md\` POM rules, pass \`npm run gate:static\`, verify with \`npx playwright test\`, and open a Pull Request with video proof.
          EOF
          )"
          fi
